function vHist(){const L=D.log.filter(hv);
 return `<div class="p"><h2>Histórico de movimentações</h2><div class="bar"><label>Tipo<select onchange="hk=this.value;render()"><option value="">Todos</option>${Object.keys(KN).map(k=>`<option value="${k}" ${hk===k?"selected":""}>${KN[k]}</option>`).join("")}</select></label><label>Garagem<select onchange="hg=this.value;render()">${opts([...new Set(L.map(m=>m.g))],1,hg)}</select></label>${fbox("fhq","Buscar por peça, OS, usuário…",hq,v=>{hq=v;$("hb").innerHTML=rowsH()})}</div><div class="w"><table><thead><tr><th>Data</th><th>Tipo</th><th>Garagem</th><th>Peça</th><th>Qtd</th><th>Detalhe</th><th>Usuário</th><th></th></tr></thead><tbody id="hb">${rowsH()}</tbody></table></div></div>`}
function est(i){const m=D.log.find(x=>x.i===i);if(!m||!can("est")||!confirm(`Estornar ${m.q>0?"+":""}${m.q} de ${m.c} em ${m.g}?`))return;log("estorno",m.c,m.g,-m.q,"Estorno de "+KN[m.k]+" de "+fd(m.t),m.i);save();render()}
/* PEÇAS: o código nunca é alterado; só a descrição */
function vPec(){return `<div class="p"><h2>Cadastro de peças</h2>${can("addp")?`<div class="f"><label>Novo código<input id="nc"></label><label>Descrição<input id="nd"></label><label>&nbsp;<button class="b" onclick="addP()">Adicionar peça</button></label></div><hr>`:""}<div class="bar">${fbox("fpq","Buscar por nome ou código",pq,v=>{pq=v;$("pb").innerHTML=rowsP()})}</div><p class="hint">${can("edp")?"Corrija a descrição direto na tabela. O código não pode ser alterado.":"Somente consulta."}</p><div class="w"><table><thead><tr><th>Código</th><th>Descrição</th></tr></thead><tbody id="pb">${rowsP()}</tbody></table></div></div>`}
function rowsP(){const q=pq.toLowerCase();return Object.keys(D.parts).sort().filter(c=>mt(c,pq)).map(c=>`<tr><td><b>${esc(c)}</b></td><td>${can("edp")?`<input value="${esc(D.parts[c].d)}" style="min-width:300px" onchange="ep('${esc(c)}',this.value)">`:esc(D.parts[c].d)}</td></tr>`).join("")}
function ep(c,v){if(!can("edp"))return;D.parts[c].d=v.trim();D.parts[c].t=Date.now();save();msg("Descrição atualizada.")}
function addP(){const c=$("nc").value.trim(),d=$("nd").value.trim();if(!c||!d)return msg("Informe código e descrição.",1);if(D.parts[c])return msg("Esse código já existe (o código não pode ser alterado).",1);D.parts[c]={d,t:Date.now()};save();render()}
/* AJUSTES (administração) */
function vAj(){const rl=Object.keys(D.roles);if(!D.roles[er])er=rl[0];const R=D.roles[er];
 return `<div class="p"><h2>Usuários</h2><div class="w"><table><thead><tr><th>Nome</th><th>Cargo</th><th>Garagens</th><th>Ativo</th><th>Senha</th></tr></thead><tbody>${Object.keys(D.users).sort().map(n=>{const u=D.users[n];return `<tr><td><b>${esc(n)}</b></td><td><select onchange="eu('${n}','r',this.value)">${opts(rl,0,u.r)}</select></td><td><details><summary>${u.g.length?esc(u.g.join(", ")):"a definir"}</summary>${G().map(g=>`<label class="ch"><input type="checkbox" ${u.g.includes(g)?"checked":""} onchange="tg('${n}','${g}',this.checked)">${esc(g)}</label>`).join("")}</details></td><td><input type="checkbox" style="width:auto" ${u.off?"":"checked"} onchange="eu('${n}','off',!this.checked)"></td><td><button class="b s" onclick="rp('${n}')">Redefinir</button></td></tr>`}).join("")}</tbody></table></div><div class="bar" style="margin-top:12px"><label>Novo usuário<input id="nu"></label><label>Cargo<select id="nr">${opts(rl)}</select></label><button class="b" style="flex:0 0 auto" onclick="addU()">Adicionar</button></div></div>
<div class="p"><h2>Perfis e permissões</h2><div class="bar"><label>Perfil<select onchange="er=this.value;render()">${opts(rl,0,er)}</select></label><button class="b s" style="flex:0 0 auto" onclick="newR()">+ Novo perfil (cópia deste)</button></div><div>${Object.keys(PL).map(k=>`<label class="ch"><input type="checkbox" ${R[k]?"checked":""} onchange="pr('${k}',this.checked)">${PL[k]}</label>`).join("")}</div><br><label>Histórico: o que pode ver<select onchange="pr('h',this.value)"><option value="own" ${R.h==="own"?"selected":""}>Só as próprias movimentações</option><option value="gar" ${R.h==="gar"?"selected":""}>Movimentações da(s) sua(s) garagem(ns)</option><option value="all" ${R.h==="all"?"selected":""}>Todas as movimentações</option></select></label></div>
<div class="p"><h2>Garagens</h2><div class="bar"><label>Nova garagem<input id="ag"></label><button class="b" style="flex:0 0 auto" onclick="addG()">Adicionar</button></div><p class="hint">Atuais: ${G().map(esc).join(", ")}</p></div>
<div class="p"><h2>Carregar saldo por planilha</h2><p class="hint">Aceita Excel (.xlsx, .xlsm, .xlsb, .xls), OpenDocument (.ods), CSV, TSV e TXT. Também dá para colar células copiadas da planilha.</p><div class="bar"><label>Arquivo<input type="file" id="if" accept=".xlsx,.xlsm,.xlsb,.xls,.ods,.csv,.tsv,.txt" onchange="loadF(this)"></label></div><label>Ou cole aqui<textarea id="it" rows="3"></textarea></label><br><button class="b s" onclick="setIM({Colado:parseT($('it').value)})">Ler texto colado</button><div id="im"></div></div>`}
function eu(n,k,v){D.users[n][k]=v;D.users[n].t=Date.now();save()}
function tg(n,g,on){const u=D.users[n];u.g=on?[...new Set([...u.g,g])]:u.g.filter(x=>x!==g);u.t=Date.now();save()}
function rp(n){if(!confirm(`Redefinir a senha de ${n} para o padrão? Ele terá que criar uma nova no próximo acesso.`))return;delete D.users[n].ph;D.users[n].t=Date.now();save();msg(`Senha de ${n} redefinida para ${defPw(n)}.`)}
function addU(){const n=$("nu").value.trim();if(!n||D.users[n]||n==="Mestre")return msg("Nome vazio ou já existe.",1);D.users[n]={r:$("nr").value,g:[],t:Date.now()};save();render()}
function pr(k,v){D.roles[er][k]=v;D.roles[er].t=Date.now();save()}
function newR(){const n=(prompt("Nome do novo perfil:")||"").trim();if(!n||D.roles[n])return;D.roles[n]={...D.roles[er],t:Date.now()};er=n;save();render()}
function addG(){const g=$("ag").value.trim();if(!g||G().includes(g))return msg("Nome vazio ou já existe.",1);D.g.push(g);save();render()}
let IM=null;
function loadF(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{if(/\.(csv|tsv|txt)$/i.test(f.name)){let s;try{s=new TextDecoder("utf-8",{fatal:true}).decode(r.result)}catch(e){s=new TextDecoder("windows-1252").decode(r.result)}setIM({[f.name]:parseT(s)})}
  else{if(!window.XLSX)return msg("A biblioteca de planilhas não carregou (é preciso internet).",1);const wb=XLSX.read(r.result,{type:"array"}),s={};wb.SheetNames.forEach(n=>s[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}));setIM(s)}}catch(e){msg("Não consegui ler este arquivo.",1)}};r.readAsArrayBuffer(f)}
function parseT(t){const L=t.split(/\r?\n/).filter(x=>x.trim()),d=["\t",";",",","|"].sort((a,b)=>L[0].split(b).length-L[0].split(a).length)[0];
 return L.map(x=>{const o=[];let c="",q=0;for(const ch of x){if(ch==='"')q=!q;else if(ch===d&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o.map(v=>v.trim())})}
function setIM(s){const k=Object.keys(s);if(!k.length||!s[k[0]].length)return msg("Arquivo vazio.",1);IM={s,n:k[0],g:G()[0],m:"add"};pickSheet()}
function pickSheet(){IM.rows=IM.s[IM.n];let h=IM.rows.findIndex(r=>r.filter(x=>String(x).trim()!=="").length>=2);IM.h=h<0?0:h;autoMap();drawIM()}
function autoMap(){const H=(IM.rows[IM.h]||[]).map(x=>String(x).toLowerCase()),f=re=>H.findIndex(x=>re.test(x));let c=f(/material|pe[çc]a|item|produto|sku/);if(c<0)c=f(/c[óo]d/);IM.cc=c<0?0:c;IM.cd=f(/descri/);IM.cq=f(/saldo|qtd|quant|estoque/);IM.cg=-1}
function drawIM(){const R=IM.rows,hd=R[IM.h]||[],nc=Math.max(1,...R.slice(0,30).map(r=>r.length));
 const co=(sel,none)=>(none?`<option value="-1" ${sel<0?"selected":""}>${none}</option>`:"")+Array.from({length:nc},(_,i)=>`<option value="${i}" ${i===sel?"selected":""}>${i+1}: ${esc(String(hd[i]??"").slice(0,30)||"(sem título)")}</option>`).join("");
 const sl=(l,k,none)=>`<label>${l}<select onchange="IM.${k}=+this.value;drawIM()">${co(IM[k],none)}</select></label>`;
 const pv=R.slice(IM.h+1,IM.h+7).map(r=>`<tr><td>${esc(r[IM.cc]??"")}</td><td>${IM.cd>=0?esc(r[IM.cd]??""):""}</td><td>${IM.cq>=0?esc(r[IM.cq]??""):""}</td><td>${IM.cg>=0?esc(r[IM.cg]??""):""}</td></tr>`).join("");
 $("im").innerHTML=`<hr><div class="f">${Object.keys(IM.s).length>1?`<label>Aba<select onchange="IM.n=this.value;pickSheet()">${opts(Object.keys(IM.s),0,IM.n)}</select></label>`:""}<label>Linha do cabeçalho<input type="number" min="1" value="${IM.h+1}" onchange="IM.h=Math.max(0,+this.value-1);autoMap();drawIM()"></label>${sl("Coluna do código","cc")}${sl("Coluna da descrição (opcional)","cd","— nenhuma —")}${sl("Coluna da quantidade/saldo","cq","— escolher —")}${sl("Coluna da garagem (opcional)","cg","— usar a garagem ao lado —")}<label>Garagem de destino<select onchange="IM.g=this.value">${opts(G(),0,IM.g)}</select></label><label>Como aplicar<select onchange="IM.m=this.value"><option value="add" ${IM.m==="add"?"selected":""}>Somar como entrada</option><option value="set" ${IM.m==="set"?"selected":""}>Definir saldo (ajusta a diferença)</option></select></label></div><p class="hint">${R.length-IM.h-1} linha(s) de dados. Prévia:</p><div class="w"><table><thead><tr><th>Código</th><th>Descrição</th><th>Quantidade</th><th>Garagem</th></tr></thead><tbody>${pv}</tbody></table></div><p class="hint">Somar: lança entradas (ignora quantidades negativas). Definir: iguala o saldo do sistema ao da planilha. Se a garagem vier por coluna, o nome precisa bater com uma garagem cadastrada.</p><button class="b v" onclick="runIM()">Importar</button>`}
function runIM(){if(IM.cq<0)return msg("Escolha a coluna da quantidade.",1);
 const nk=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,""),gm={};G().forEach(g=>gm[nk(g)]=g);
 const num=v=>typeof v==="number"?v:parseFloat(String(v).trim().replace(/\s/g,"").replace(/,/,".").replace(/\.(?=\d{3}\b)/g,""));
 const acc={},dd={};let bad=0;
 IM.rows.slice(IM.h+1).forEach(r=>{const c=String(r[IM.cc]??"").trim();if(!c)return;let q=num(r[IM.cq]);if(isNaN(q))return;
  const g=IM.cg>=0?gm[nk(r[IM.cg])]:IM.g;if(!g){bad++;return}
  acc[g+"|"+c]=(acc[g+"|"+c]||0)+Math.round(q);if(IM.cd>=0&&!dd[c])dd[c]=String(r[IM.cd]??"").trim()});
 let n=0;for(const k in acc){const[g,c]=k.split("|"),q=acc[k];
  if(!D.parts[c])D.parts[c]={d:dd[c]||"",m:0,t:Date.now()};else if(!D.parts[c].d&&dd[c]){D.parts[c].d=dd[c];D.parts[c].t=Date.now()}
  if(IM.m==="add"){if(q>0){log("entrada",c,g,q,"Saldo importado (planilha)");n++}}
  else{const d=q-bal(c,g);if(d){log("conf",c,g,d,"Saldo definido pela planilha: "+q);n++}}}
 save();IM=null;msg(`${n} movimentação(ões) lançada(s).`+(bad?` ${bad} linha(s) com garagem não reconhecida.`:""),bad&&!n);render()}
calc();render();if(cfg.tk)sync();else setSt("");
</script></body></html>
